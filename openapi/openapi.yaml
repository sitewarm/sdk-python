openapi: 3.1.0
info:
  title: sitewarm public API
  version: 0.1.0
  summary: Manage sites, warm runs, schedules, webhooks and API keys of the hosted sitewarm service.
  description: |
    This document is the source of truth for the public REST API; the server, the SDKs and the contract
    tests are built from it.

    ## Vocabulary

    A **site** is one hostname. A **vantage
    point** is the place a run's requests are sent from (`region` is an attribute of it). The
    **cache status** of a URL is one of the normalized states in `CacheState`; `GET` results also carry
    the raw CDN header value untouched in `cdn_cache_header`. Indexability is a separate field, never a
    cache state.

    ## Conventions

    - **Versioning.** The base path is `/v1`. Breaking changes need a new major path.
    - **Authentication.** Every operation takes a scoped API key as a bearer token
      (`Authorization: Bearer <key>`). Session cookies are never accepted. Each operation lists the
      scope it needs. A request for a resource of another organization returns `404`, not `403`.
    - **Idempotency.** Send `Idempotency-Key` on `POST`. Repeating a request with the same key and the
      same body returns the first response and sets `Idempotent-Replayed: true`. The same key with a
      different body is a `409` problem of type `idempotency-key-reused`. The warm-run trigger requires
      the header; the other `POST` operations accept it.
    - **Pagination.** Lists use opaque cursors: pass `cursor` from `page.next_cursor` of the previous
      page. Clients must not parse cursors.
    - **Errors.** Every error is `application/problem+json` as in RFC 9457. The `type` member is a URI
      reference naming one of the problem types listed in `ProblemType`.
    - **Rate limits.** Every response except `500` carries `RateLimit-Limit`, `RateLimit-Remaining` and
      `RateLimit-Reset`. A `429` also carries `Retry-After`.
    - **Async work.** Starting a warm run answers `202 Accepted` with a `Location` header pointing at
      the warm-run resource, which is the status resource to poll. Cancelling is also asynchronous.
    - **Webhooks.** Events are delivered with an HMAC-SHA256 signature, see the `webhooks` section.
    - **Time and ids.** Timestamps are RFC 3339 UTC. Ids are opaque strings. Durations are strings
      such as `10s` or `5m`, as in the CLI.
    - **Sensitive data.** The API never returns `Cookie`, `Set-Cookie` or `Authorization` values from a
      customer site, and never accepts them. Header names such as `Cache-Control`, `Age` and `Vary`
      are returned as observed.
    - **Safety.** A site must be verified before any run. Triggering a run for an unverified
      or paused site is rejected with a problem.
  contact:
    name: sitewarm
    url: https://github.com/sitewarm
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: |
      Relative to the host that serves the API.

tags:
  - name: Sites
    description: Hostnames the organization owns, and their sitemaps and URL sets.
  - name: Warm runs
    description: Warm and verify runs, their status and their results.
  - name: Cache status reports
    description: Cache status per route group and vantage point, derived from warm runs.
  - name: Schedules
    description: Recurring warm runs.
  - name: Webhooks
    description: Outbound event subscriptions signed with HMAC.
  - name: API keys
    description: Scoped credentials for this API.
security:
  - ApiKey: []
paths:
  /sites:
    get:
      operationId: listSites
      summary: List sites
      tags: [Sites]
      security:
        - ApiKey: [sites:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sites.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSite
      summary: Create a site
      description: |
        Creates an unverified site. Verification is done outside this API; until it passes, runs for
        the site are rejected (`site-not-verified`). A site is one hostname: the apex and its `www` are
        the same site.
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
      responses:
        '201':
          description: The site was created.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSite
      summary: Get a site
      tags: [Sites]
      security:
        - ApiKey: [sites:read]
      responses:
        '200':
          description: The site.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateSite
      summary: Update site settings
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: The updated site.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSite
      summary: Delete a site and its history
      description: Deletes the site, its sitemaps, URL sets, schedules and stored results.
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      responses:
        '204':
          description: The site was deleted.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/sitemaps:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listSitemaps
      summary: List the sitemaps of a site
      tags: [Sites]
      security:
        - ApiKey: [sites:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sitemaps.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitemapList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSitemap
      summary: Register a sitemap
      description: The sitemap URL must be on the site's hostname. Sitemap indexes and `.gz` files are accepted.
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SitemapCreate'
      responses:
        '201':
          description: The sitemap was registered.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sitemap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/sitemaps/{sitemapId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SitemapId'
    get:
      operationId: getSitemap
      summary: Get a sitemap
      tags: [Sites]
      security:
        - ApiKey: [sites:read]
      responses:
        '200':
          description: The sitemap.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sitemap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSitemap
      summary: Remove a sitemap
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      responses:
        '204':
          description: The sitemap was removed.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/url-sets:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listUrlSets
      summary: List the URL sets of a site
      description: |
        A URL set is an explicit, ordered list of URLs, the hosted equivalent of the CLI's `--top-from`
        file. The order is the warming priority.
      tags: [Sites]
      security:
        - ApiKey: [sites:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of URL sets (without their URLs).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlSetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createUrlSet
      summary: Create a URL set
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlSetWrite'
      responses:
        '201':
          description: The URL set was created.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/url-sets/{urlSetId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/UrlSetId'
    get:
      operationId: getUrlSet
      summary: Get a URL set with its URLs
      tags: [Sites]
      security:
        - ApiKey: [sites:read]
      responses:
        '200':
          description: The URL set.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceUrlSet
      summary: Replace a URL set
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlSetWrite'
      responses:
        '200':
          description: The replaced URL set.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteUrlSet
      summary: Delete a URL set
      tags: [Sites]
      security:
        - ApiKey: [sites:write]
      responses:
        '204':
          description: The URL set was deleted.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/warm-runs:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listWarmRuns
      summary: List warm runs of a site
      tags: [Warm runs]
      security:
        - ApiKey: [warm-runs:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Only runs in this lifecycle status.
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: trigger_type
          in: query
          description: Only runs started this way.
          schema:
            $ref: '#/components/schemas/TriggerType'
      responses:
        '200':
          description: A page of warm runs, newest first.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmRunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWarmRun
      summary: Start a warm run (for example after a deploy)
      description: |
        Queues a run that warms and verifies the URLs of one source, from the vantage points the
        organization is entitled to, and answers `202`. Poll `GET /warm-runs/{runId}` (the `Location`
        header) until `status` is `completed` or `canceled`, then read `outcome` and the results.

        The run is rejected if the site is not verified (`site-not-verified`), is paused (`site-paused`),
        or the organization is over a limit (`quota-exceeded`).

        `source` may be omitted: the run then warms the URLs of the site's discovered sitemaps
        (`robots.txt` and `/sitemap.xml`). In the current implementation `source` of type `sitemap` or
        `url_set`, `vantage_point_ids` and every option other than `top` and `fail_on` answer `422`
        (`validation-failed`) with a JSON Pointer; they are never ignored silently. Only one run per
        site may be queued or running (`conflict`).

        `Idempotency-Key` is required: a retried trigger from CI must not start a second run.

      tags: [Warm runs]
      security:
        - ApiKey: [warm-runs:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarmRunCreate'
            examples:
              afterDeploy:
                summary: Warm the sitemap after a production deploy
                value:
                  source:
                    type: sitemap
                    sitemap_id: sm_example
                  deployment:
                    id: deploy-1234
                    environment: production
                    ref: 0123abcd
                  options:
                    fail_on: [miss, error, noindex]
      responses:
        '202':
          description: The run was accepted and queued.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /warm-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getWarmRun
      summary: Get a warm run (status resource)
      description: |
        While the run is `queued` or `running` the response carries `Retry-After` with the suggested
        polling delay. `outcome` is null until the run is `completed`.
      tags: [Warm runs]
      security:
        - ApiKey: [warm-runs:read]
      responses:
        '200':
          description: The warm run, with a per-vantage-point summary.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
